# Workers + Static Assets (optional). Run: npm run workers:deploy
# Requires: npm run build first so ./dist exists.
# "main" is a real Worker module — NOT ./dist/index.js (Vite outputs HTML/CSS/JS there).

name = "healthinsuranceleadgenerationfinal"
main = "worker/index.ts"
compatibility_date = "2025-03-25"

[assets]
directory = "dist"
binding = "ASSETS"
