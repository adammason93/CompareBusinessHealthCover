# Compare Business Health Cover — Cloudflare Worker
# Deploy: npm run deploy (or Workers Builds: build npm run build, deploy npx wrangler deploy)
#
# Domain: comparebusinesshealthcover.co.uk ONLY — do not add healthcovercomparison.co.uk here.

name = "comparebusinesshealthcover"
main = "worker/index.ts"
compatibility_date = "2026-03-25"

[build]
command = "npm run build"

[[routes]]
pattern = "comparebusinesshealthcover.co.uk"
custom_domain = true

[[routes]]
pattern = "www.comparebusinesshealthcover.co.uk"
custom_domain = true

# AI crawlers (GPTBot, OAI-SearchBot, Claude, Perplexity) were 403ing in live tests.
# In the Cloudflare dashboard for this zone: Security → Settings → Bot traffic
# 1. Turn OFF "Block AI bots" (or set Search + Agent to Allow).
# 2. AI Crawl Control → Allow GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, PerplexityBot, Grok.
# 3. If Bot Fight Mode (Free) is on, turn it OFF or upgrade — it cannot be skipped with WAF rules.
# Super Bot Fight Mode: set Verified bots to Allow; Skip SBFM for those user-agents if needed.

[assets]
directory = "dist"
binding = "STATIC"
html_handling = "auto-trailing-slash"
# Worker serves unknown paths as the SPA. Prerendered /path/index.html files are used first.
not_found_handling = "none"
