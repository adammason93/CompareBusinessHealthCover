# Cloudflare — one config for Workers deploy (`npx wrangler deploy`) and Pages hints.
#
# Pages (recommended for this Vite SPA): Workers & Pages → Pages → Connect Git
#   Build: npm run build | Output: dist | Node: 20 (.nvmrc)
#   Do not set a deploy command on Pages — it uploads dist automatically.
#
# Workers Builds (Git): Build: npm run build | Deploy: npx wrangler deploy
#   Worker entry serves ./dist via Assets (not dist/index.js — that is HTML from Vite).
#
# SPA routing: worker/index.ts (404 → /index.html). Avoid public/_redirects /* → index.html on Workers.
# -----------------------------------------------------------------------------

name = "healthinsuranceleadgenerationfinal"
main = "worker/index.ts"
compatibility_date = "2026-03-25"
# Do not set pages_build_output_dir here — it makes Wrangler treat this as a Pages
# project and warn on `wrangler deploy`. For Pages-only, set output dir "dist" in the dashboard.

[assets]
directory = "dist"
binding = "STATIC"
